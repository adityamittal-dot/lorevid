name: daily-video
on:
  schedule:
    - cron: "17 3 * * *"        # 08:47 IST daily; video is waiting for review by the afternoon
  workflow_dispatch:
    inputs:
      topic: {description: "Topic (blank = next in topics/long.txt)", default: "", type: string}
      upload: {description: "Upload to YouTube (private)", default: true, type: boolean}

permissions:
  contents: write

concurrency: {group: daily-video, cancel-in-progress: false}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: kokoro-v1}
      - name: YouTube credentials
        env: {S: "${{ secrets.YT_CLIENT_SECRET }}", T: "${{ secrets.YT_TOKEN }}"}
        run: |
          [ -n "$S" ] && printf '%s' "$S" > yt_client_secret.json
          [ -n "$T" ] && printf '%s' "$T" > yt_token.json
          true
      - name: Make video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'bm_george' }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
        run: |
          UP=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload }}" = "true" ]; then UP="--upload"; fi
          if [ -n "${{ inputs.topic }}" ]; then python pipeline.py "${{ inputs.topic }}" $UP; else python pipeline.py --next-topic $UP; fi
      - name: Save topic queue + cost log
        if: always()
        run: |
          git config user.name "lorevid-bot"; git config user.email "lorevid-bot@users.noreply.github.com"
          git add topics/ costs.csv 2>/dev/null || true
          git commit -qm "daily run $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            output/*/short*/short.mp4
            output/*/script.json
          retention-days: 7

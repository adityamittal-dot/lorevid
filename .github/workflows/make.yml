name: daily-video
# Runs when the daily Claude writer session pushes scripts/<date>.json.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["scripts/*.json"]
  schedule:
    - cron: "30 5 * * *"   # 11:00 IST: if no fresh script arrived today, use the reserve (after RESERVE_FROM)
  workflow_dispatch:
    inputs:
      upload: {description: "Upload to YouTube (private)", default: true, type: boolean}
      from_reserve: {description: "Use the oldest reserve script", default: false, type: boolean}

permissions:
  contents: write

concurrency: {group: daily-video, cancel-in-progress: false}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: kokoro-v1}
      - name: YouTube credentials
        env: {S: "${{ secrets.YT_CLIENT_SECRET }}", T: "${{ secrets.YT_TOKEN }}"}
        run: |
          [ -n "$S" ] && printf '%s' "$S" > yt_client_secret.json
          [ -n "$T" ] && printf '%s' "$T" > yt_token.json
          true
      - name: Make video
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'bm_george' }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
        run: |
          UP=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.upload }}" = "true" ]; then UP="--upload"; fi
          S=$(ls -1 scripts/*.json 2>/dev/null | sort | head -1)
          RESERVE_FROM="${{ vars.RESERVE_FROM || '2026-11-11' }}"
          USE_RESERVE=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # daily fallback: only after the writer stops (credits end) and only if today's video wasn't made
            if [[ "$(date -u +%F)" < "$RESERVE_FROM" ]]; then echo "Writer still active; reserve untouched"; exit 0; fi
            if git log --since="20 hours ago" --oneline | grep -q "rendered"; then echo "Already posted today"; exit 0; fi
            USE_RESERVE=1
          fi
          [ "${{ inputs.from_reserve }}" = "true" ] && USE_RESERVE=1
          if [ -n "$USE_RESERVE" ]; then
            R=$(ls -1 scripts/reserve/*.json 2>/dev/null | sort | head -1)
            if [ -z "$R" ]; then echo "Reserve is empty"; exit 0; fi
            git mv "$R" "scripts/$(basename "$R")"; S="scripts/$(basename "$R")"
            echo "Using reserve script $R ($(ls scripts/reserve/*.json 2>/dev/null | wc -l) left)"
          fi
          if [ -z "$S" ]; then echo "No new script in scripts/ - nothing to render"; exit 0; fi
          echo "Rendering $S"
          # pipeline.py is resumable (already-rendered images/audio are skipped), so on a
          # transient image-backend outage just wait and try again instead of failing the day.
          for i in 1 2 3; do
            export FINAL_ATTEMPT=$([ "$i" = 3 ] && echo 1 || echo 0)
            python pipeline.py --script "$S" $UP && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "Render failed (attempt $i/3), retrying in 15 min..."
            sleep 900
          done
      - name: Merge script into main and mark it done
        run: |
          git config user.name "lorevid-bot"; git config user.email "lorevid-bot@users.noreply.github.com"
          git add -A topics/ scripts/ 2>/dev/null || true
          git commit -qm "rendered $(date -u +%F)" || true
          BR="${GITHUB_REF#refs/heads/}"
          if [ "$BR" != "main" ]; then
            git fetch -q origin main
            git checkout -q -B main origin/main
            git merge -q --no-edit "$BR" -m "merge $BR (rendered)"
          fi
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
          if [ "$BR" != "main" ]; then git push -q origin --delete "$BR" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            output/*/final.mp4
            output/*/thumbnail*.jpg
            output/*/short*/short.mp4
            output/*/script.json
          retention-days: 7

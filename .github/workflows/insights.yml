name: insights

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on 2026-10-19
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth-oauthlib

      - name: Set up credentials
        env:
          S: ${{ secrets.YT_CLIENT_SECRET }}
          T: ${{ secrets.YT_TOKEN }}
          RS: ${{ secrets.YT_RESERVE_CLIENT_SECRET }}
          RT: ${{ secrets.YT_RESERVE_TOKEN }}
        run: |
          [ -n "$S" ] && printf '%s' "$S" > yt_client_secret.json
          [ -n "$T" ] && printf '%s' "$T" > yt_token.json
          [ -n "$RS" ] && printf '%s' "$RS" > yt_reserve_client_secret.json
          [ -n "$RT" ] && printf '%s' "$RT" > yt_reserve_token.json
          true

      - name: Run insights and commit
        run: |
          python insights.py
          git config user.name "lorevid-bot"
          git config user.email "lorevid-bot@users.noreply.github.com"
          git add data
          git commit -m "insights $(date -u +'%Y-%m-%d')" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || sleep 2
          done

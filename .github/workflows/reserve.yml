name: save-reserve
# Reserve scripts are written on claude/ branches; this merges them into main so they are kept.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/reserve/**"]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git config user.name "lorevid-bot"; git config user.email "lorevid-bot@users.noreply.github.com"
          BR="${GITHUB_REF#refs/heads/}"
          git checkout -q -B main origin/main
          git merge -q --no-edit "origin/$BR" -m "save reserve from $BR"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
          git push -q origin --delete "$BR" || true
          echo "Reserve now holds $(ls scripts/reserve/*.json | wc -l) scripts"

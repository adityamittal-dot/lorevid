name: save-reserve
# A reserve writer run pushes scripts/reserve/<date>-<slot>.json on a claude/ branch.
# This merges it into main, renders the video + 2 Shorts, and uploads them to YouTube as PRIVATE
# (using the second Google project's quota, YT_RESERVE_* secrets). Schedule them in Studio whenever you want.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/reserve/**"]
  schedule:
    - cron: "30 17 * * *"   # 23:00 IST: retry a reserve script whose render failed (does nothing if none are waiting)
  workflow_dispatch:     # render any reserve scripts that are still waiting
permissions:
  contents: write
concurrency: {group: reserve, cancel-in-progress: false}
jobs:
  reserve:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Merge the reserve script into main
        id: pick
        run: |
          git config user.name "lorevid-bot"; git config user.email "lorevid-bot@users.noreply.github.com"
          BR="${GITHUB_REF#refs/heads/}"
          git checkout -q -B main origin/main
          if [ "$BR" != "main" ]; then
            git merge -q --no-edit "origin/$BR" -m "save reserve from $BR"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
            git push -q origin --delete "$BR" || true
          fi
          echo "Waiting to render: $(ls scripts/reserve/*.json 2>/dev/null | wc -l)"
          # at most 1 per run: 3 uploads (video + 2 Shorts) = ~4,850 quota units
          echo "script=$(ls -1 scripts/reserve/*.json 2>/dev/null | sort | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.pick.outputs.script != ''
        with: {python-version: "3.12", cache: pip}
      - name: System packages
        if: steps.pick.outputs.script != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
      - name: Python packages
        if: steps.pick.outputs.script != ''
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache voice model
        if: steps.pick.outputs.script != ''
        uses: actions/cache@v6
        with: {path: ~/.cache/huggingface, key: kokoro-v1}
      - name: YouTube credentials (reserve project, falls back to the main one)
        if: steps.pick.outputs.script != ''
        env:
          S: ${{ secrets.YT_RESERVE_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
          T: ${{ secrets.YT_RESERVE_TOKEN || secrets.YT_TOKEN }}
        run: |
          printf '%s' "$S" > yt_client_secret.json
          printf '%s' "$T" > yt_token.json
      - name: Render and upload reserve videos (private)
        if: steps.pick.outputs.script != ''
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'bm_george' }}
        run: |
          S="${{ steps.pick.outputs.script }}"
          echo "Rendering reserve $S"
          # pipeline.py is resumable (already-rendered images/audio are skipped), so on a
          # transient image-backend outage just wait and try again instead of failing the run.
          for i in 1 2 3; do
            export FINAL_ATTEMPT=$([ "$i" = 3 ] && echo 1 || echo 0)
            python pipeline.py --script "$S" --reserve --upload && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "Render failed (attempt $i/3), retrying in 15 min..."
            sleep 900
          done
      - name: Record it
        if: steps.pick.outputs.script != ''
        run: |
          git add -A scripts/ 2>/dev/null || true
          git commit -qm "reserve uploaded $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
      - uses: actions/upload-artifact@v7
        if: always() && steps.pick.outputs.script != ''
        with:
          name: reserve-video
          path: |
            output/*/final.mp4
            output/*/thumbnail*.jpg
            output/*/short*/short.mp4
          retention-days: 3
